name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build signed APK + AAB
        env:
          ECHO_KEYSTORE: ${{ runner.temp }}/release.jks
          ECHO_KEYSTORE_PASSWORD: ${{ secrets.ECHO_KEYSTORE_PASSWORD }}
          ECHO_KEY_ALIAS: ${{ secrets.ECHO_KEY_ALIAS }}
          ECHO_KEY_PASSWORD: ${{ secrets.ECHO_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ECHO_KEYSTORE_BASE64 }}" | base64 -d > "$ECHO_KEYSTORE"
          ./gradlew assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "Echo-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "Echo-${GITHUB_REF_NAME}.aab"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Echo-*.apk Echo-*.aab --generate-notes
